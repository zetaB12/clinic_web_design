<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Restaura la ruta enviada por 404.html (fallback SPA de GitHub Pages).
      (function (l) {
        if (l.search[1] === '/') {
          var d = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + d[0] + (d[1] ? '?' + d.slice(1).join('&') : '') + l.hash
          );
        }
      })(window.location);
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2A2420" />
    <title>REJUVENA | Medicina Estética</title>
    <meta
      name="description"
      content="Valoración médica de 40 minutos, plan por escrito y resultados naturales. Reserva tu cita en REJUVENA Medicina Estética."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="REJUVENA | Medicina Estética" />
    <meta
      property="og:description"
      content="Realzamos tu belleza natural a través de la ciencia, la precisión y el cuidado personalizado."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400&family=Geist:wght@400;500;600&family=Marcellus&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
