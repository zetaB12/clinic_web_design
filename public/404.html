<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>REJUVENA | Medicina Estética</title>
    <meta name="robots" content="noindex" />
    <script>
      // Fallback SPA para GitHub Pages: reenvía cualquier ruta a index.html
      // conservándola en la query (?/ruta). index.html la restaura con history.replaceState.
      // Sitio de proyecto (/clinic_web_design/): se conserva 1 segmento.
      var segmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host +
          l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
